<div
  class="spinner"
  *ngIf="(!artCategories || !loadedRelations) && selectedCategorySub.getValue()"
>
  <app-small-spinner [diameter]="50"></app-small-spinner>
</div>

<h2
  class="category-not-selected"
  *ngIf="!loadedRelations && !selectedCategorySub.getValue()"
>
  Select the category
</h2>

<div class="relations" *ngIf="artCategories && loadedRelations">
  <div class="artfields" *ngFor="let category of artCategories">
    <div class="artfields__name" *ngIf="!category.parent_id">
      <h2>
        {{ category.name }}<br />
        <mat-slider
          min="0"
          max="1"
          step="0.1"
          #inpt
          (change)="onCategoryRelationChange(category, inpt.value)"
          [value]="relationForCategory(category.id)"
          [thumbLabel]="true"
        ></mat-slider>
      </h2>

      <div class="category__name" *ngFor="let subcat of category.subcategories">
        <h4>
          {{ subcat.name }}<br />
          <mat-slider
            min="0"
            max="1"
            step="0.1"
            #inpt
            [value]="relationForCategory(subcat.id)"
            [thumbLabel]="true"
            (change)="onCategoryRelationChange(subcat, inpt.value)"
          ></mat-slider>
        </h4>

        <div
          class="subcategory__name"
          *ngFor="let subsubcat of subcat.subcategories"
        >
          <p>
            {{ subsubcat.name }}<br />
            <mat-slider
              min="0"
              max="1"
              step="0.1"
              #inpt
              [value]="relationForCategory(subsubcat.id)"
              [thumbLabel]="true"
              (change)="onCategoryRelationChange(subsubcat, inpt.value)"
            ></mat-slider>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
