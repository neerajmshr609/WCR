<div
  class="av-rating-slider"
  [ngClass]="param.active && (!paused() || (paused() && param.focused)) ? 'av-rating-slider__active--' + color : 'av-rating-slider' "
  (click)="onParamClick()"
>
  <div
    [ngClass]="
      param.active && (!paused() || (paused() && param.focused))
        ? 'av-rating-slider__name av-rating-slider__name--' +
          color +
          '--selected'
        : 'av-rating-slider__name'
    "
  >
    <span>{{ name }}</span>
    <mat-icon [matMenuTriggerFor]="menu">more_vert</mat-icon>

  </div>


  <div
    [ngClass]="
       param.active && (!paused() || (paused() && param.focused))
        ? 'av-rating-slider__slider av-rating-slider__slider-' +
          color +
          '--selected'
        : 'av-rating-slider__slider av-rating-slider__slider-' + color
    "
  >
      <ngx-slider
        #slider
        (userChangeEnd)="onUserChangeEnd($event)"
        (userChange)="onUserChangeStart(slider)"
        [(value)]="sliderValue"
        [options]="options()"
      ></ngx-slider>
  </div>

</div>
