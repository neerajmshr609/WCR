<div class="section-header">
  @if (sectionTitle()) {
    <h2 class="sectionTitle" [innerHTML]="sectionTitle() | translate"></h2>
  }
  <div class="icon-wrapper">
    <ng-content></ng-content>
  </div>
  @if (title()) {
    <p class="title">{{ title() }}</p>
  }
  @if (subtitle()) {
    <p class="subtitle">{{ subtitle() }}</p>
  }
</div>
