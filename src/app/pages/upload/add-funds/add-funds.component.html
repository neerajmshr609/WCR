<div class="add-funds">
  {{ error }}
  <div class="form__group">
    <label class="form__label" for="amount">Amount</label>
    <input
      class="form__input"
      type="text"
      id="amount"
      name="amount"
      #priceInput
      placeholder="minimal of €{{ uploadPrice }}"
    />
  </div>

  <ngx-paypal [config]="payPalConfig"></ngx-paypal>
  <app-small-spinner
    [diameter]="50"
    *ngIf="paymentInProgress"
  ></app-small-spinner>
</div>
