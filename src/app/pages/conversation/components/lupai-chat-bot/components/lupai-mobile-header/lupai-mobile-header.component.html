<div class="lupai-mobile-header">
    <div class="lupai-mobile-header__container">
        <!-- Left side - Bot Controls -->
        <div class="lupai-mobile-header__bot-controls">
            <button class="lupai-mobile-header__nav-btn" (click)="onNavigateLeftClick()">
                <mat-icon>keyboard_arrow_left</mat-icon>
            </button>
            <div class="lupai-mobile-header__icon-container">
                <img [src]="robotIconSrc()" class="lupai-mobile-header__robot-icon" alt="Robot" />
            </div>
            <button class="lupai-mobile-header__nav-btn" (click)="onNavigateRightClick()">
                <mat-icon>keyboard_arrow_right</mat-icon>
            </button>
        </div>

        <!-- Right side - Action Buttons -->
        @if (showActionButtons()) {
        <div class="lupai-mobile-header__actions">
            <button class="lupai-mobile-header__menu-btn" (click)="onPlusClick()">
                <mat-icon>add</mat-icon>
            </button>
            <button class="lupai-mobile-header__menu-btn" (click)="onMenuClick()">
                <mat-icon>more_vert</mat-icon>
            </button>
        </div>
        }
    </div>
</div>
