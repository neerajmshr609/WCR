<div class="coming--soon">
  <div class="coming--soon__image--box">
    <img [src]="url" alt="" class="coming--soon__image--box__picture" />
  </div>
  <p class="coming--soon__message--title">{{ 'coming_soon.title' | translate }}</p>
  <p class="coming--soon__message" [ngStyle]="{ color: color }">{{ text | translate }}</p>
</div>
