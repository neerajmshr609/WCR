<div class="spinner" *ngIf="!loadedCategories">
  <app-small-spinner [diameter]="50"></app-small-spinner>
</div>

<div class="admin" *ngIf="loadedCategories">
  <div class="admin__menu">
    <mat-tree [dataSource]="dataSource" [treeControl]="treeControl">
      <mat-tree-node
        *matTreeNodeDef="let node"
        matTreeNodePadding
        class="clickable"
        (click)="onCategorySelect(node, true)"
        [ngClass]="{ selected: selectedCategory?.id === node.id }"
      >
        <button mat-icon-button disabled></button>
        {{ node.name }}
      </mat-tree-node>

      <mat-tree-node
        *matTreeNodeDef="let node; when: hasChild"
        matTreeNodePadding
        (click)="onCategorySelect(node)"
        [ngClass]="{
          selected: selectedCategory?.id === node.id,
          clickable: node.hasParent,
        }"
      >
        <button
          mat-icon-button
          matTreeNodeToggle
          [attr.aria-label]="'toggle ' + node.name"
        >
          <mat-icon class="mat-icon-rtl-mirror">{{
            treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'
          }}</mat-icon>
        </button>
        {{ node.name }}
      </mat-tree-node>
    </mat-tree>
  </div>

  <div class="admin__content">
    <app-artrelations
      [selectedCategorySub]="selectedCategory$"
      [artCategories]="loadedCategories"
    ></app-artrelations>
  </div>
</div>
