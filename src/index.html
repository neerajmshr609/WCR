      #loader-container * {
        -webkit-box-sizing: border-box;
        box-sizing: border-box;
      }
      #loader-container *::before,
      #loader-container *::after {
        -webkit-box-sizing: border-box;
        box-sizing: border-box;
      }
      #loader-container {
        font-family: 'Roboto', sans-serif;
        font-size: 16px;
        line-height: 1.5;
        display: -webkit-box;
        display: -ms-flexbox;
        display: flex;
        -webkit-box-align: center;
        -ms-flex-align: center;
        align-items: center;
        -webkit-box-pack: center;
        -ms-flex-pack: center;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        background: #f7f7f7;
        overflow: hidden;
        position: relative;
      }
      .loader-divider {
        position: absolute;
        z-index: 2;
        top: 65px;
        left: 200px;
        width: 50px;
        height: 15px;
        background: #f7f7f7;
      }
      .loader-text {
        position: relative;
        font-size: 60px;
        font-weight: 300;
        margin: 0;
        white-space: nowrap;
      }
      .loader-text::before {
        position: absolute;
        content: '';
        z-index: 1;
        top: 40px;
        left: 115px;
        width: 6px;
        height: 6px;
        background: #000;
        border-radius: 50%;
        -webkit-animation: dotMoveBig 1800ms
          cubic-bezier(0.25, 0.25, 0.75, 0.75) infinite;
        animation: dotMoveBig 1800ms cubic-bezier(0.25, 0.25, 0.75, 0.75)
          infinite;
      }
      .loader-letter {
        display: inline-block;
        position: relative;
        color: #000;
        letter-spacing: 8px;
      }
      .loader-letter:nth-child(1) {
        -webkit-transform-origin: 100% 70%;
        -ms-transform-origin: 100% 70%;
        transform-origin: 100% 70%;
        -webkit-transform: scale(1, 1.275);
        -ms-transform: scale(1, 1.275);
        transform: scale(1, 1.275);
      }
      .loader-letter:nth-child(1)::before {
        position: absolute;
        content: '';
        top: 18px;
        left: 0;
        width: 14px;
        height: 36px;
        background: #f7f7f7;
        -webkit-transform-origin: 100% 0;
        -ms-transform-origin: 100% 0;
        transform-origin: 100% 0;
        -webkit-animation: lineStretch 1800ms
          cubic-bezier(0.25, 0.25, 0.75, 0.75) infinite;
        animation: lineStretch 1800ms cubic-bezier(0.25, 0.25, 0.75, 0.75)
          infinite;
      }
      .loader-letter:nth-child(5) {
        -webkit-transform-origin: 100% 70%;
        -ms-transform-origin: 100% 70%;
        transform-origin: 100% 70%;
        -webkit-animation: letterStretch 1800ms
          cubic-bezier(0.25, 0.23, 0.73, 0.75) infinite;
        animation: letterStretch 1800ms cubic-bezier(0.25, 0.23, 0.73, 0.75)
          infinite;
      }
      .loader-letter:nth-child(5)::before {
        position: absolute;
        content: '';
        top: 15px;
        left: 2px;
        width: 9px;
        height: 15px;
        background: #f7f7f7;
      }
      @-webkit-keyframes dotMoveBig {
        0%,
        100% {
          -webkit-transform: rotate(180deg) translate(-110px, -8px)
            rotate(-180deg);
          transform: rotate(180deg) translate(-110px, -8px) rotate(-180deg);
        }
        50% {
          -webkit-transform: rotate(0deg) translate(-112px, 4px) rotate(0deg);
          transform: rotate(0deg) translate(-112px, 4px) rotate(0deg);
        }
      }
      @keyframes dotMoveBig {
        0%,
        100% {
          -webkit-transform: rotate(180deg) translate(-110px, -8px)
            rotate(-180deg);
          transform: rotate(180deg) translate(-110px, -8px) rotate(-180deg);
        }
        50% {
          -webkit-transform: rotate(0deg) translate(-112px, 4px) rotate(0deg);
          transform: rotate(0deg) translate(-112px, 4px) rotate(0deg);
        }
      }
      @-webkit-keyframes dotMoveSmall {
        0%,
        100% {
          -webkit-transform: rotate(180deg) translate(-78px, 2px)
            rotate(-180deg);
          transform: rotate(180deg) translate(-78px, 2px) rotate(-180deg);

      }

        50% {

          transform: rotate(0deg) translate(-114px, 7px) rotate(0deg);
        }
      }

      @-webkit-keyframes letterStretch {
        0%,
        100% {
          -webkit-transform: scale(1, 0.35);
          transform: scale(1, 0.35);
          -webkit-transform-origin: 100% 75%;

          transform-origin: 100% 75%;

        50%,

          transform: scale(1);
          -webkit-transform-origin: 100% 75%;
          transform-origin: 100% 75%;
        }
      }
      @keyframes letterStretch {
        0%,
        100% {
          -webkit-transform: scale(1, 0.35);

      }
      @-webkit-keyframes lineStretch {
        0%,
        45%,
        70%,
        100% {
          -webkit-transform: scaleY(0.125);
          transform: scaleY(0.125);
        }
        49% {
          -webkit-transform: scaleY(0.75);

          transform: scaleY(0.5);
        }
        60% {

          transform: scaleY(0);
        }
        68% {

          transform: scaleY(0.18);
        }
      }
      @keyframes lineStretch {
        0%,
        45%,
        70%,

        }
        49% {

        }

        }

      @media (max-width: 768px) {
        .loader-text {
          font-size: 50px;

        .loader-text::before {

          animation: dotMoveSmall 1800ms cubic-bezier(0.25, 0.25, 0.75, 0.75)
            infinite;
        }
      }
